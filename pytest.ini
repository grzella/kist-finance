[pytest]
# DeprecationWarning is an error, not a whisper in the log.
#
# Precedent (2026-08-15, twin instance): a module-level re.compile() joined
# secret patterns carrying an inline `(?i)` flag into one alternation, leaving
# the flag mid-expression. Local Python 3.9 only raised a DeprecationWarning
# and the suite stayed green — CI on 3.12 failed hard at import and took down
# both jobs. The warning had been in the pytest output the whole time.
#
# Now that class of breakage fails locally, before it reaches CI.
#
# Keep the local interpreter matched to CI (Python 3.12); run the suite through
# the venv rather than the system python:  .venv/bin/python -m pytest
filterwarnings =
    error::DeprecationWarning
